[project]
name = "customer-churn-prediction-platform"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.6.0",
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
    "streamlit>=1.66.1",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The project name has hyphens and differs from the package folder, so say which
# folder under src/ is the package.
module-name = "churn_platform"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
]
