[project]
name = "customer-churn-prediction-platform"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.6.0",
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
    "streamlit>=1.66.1",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The project name has hyphens and differs from the package folder, so say which
# folder under src/ is the package.
module-name = "churn_platform"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# E/W: PEP 8 style, F: unused or undefined names, I: import order, N: PEP 8 naming.
select = ["E", "W", "F", "I", "N"]
# A capital X for the feature table (and lowercase y for the target) is the standard
# scikit-learn convention, so the PEP 8 lowercase-name rules are switched off for it.
ignore = ["N803", "N806"]

[tool.mypy]
files = ["src"]
python_version = "3.12"
# scikit-learn and joblib ship no type information, so their imports count as untyped.
ignore_missing_imports = true
