# Deploys the app to Render as a Docker web service. Connect the repository in the
# Render dashboard (New > Blueprint) and it reads this file.
services:
  - type: web
    name: customer-churn-prediction
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /_stcore/health
    envVars:
      # Each visitor trains a private model; the built-in demo model is never changed.
      - key: DEMO_MODE
        value: "1"
      # Largest upload in megabytes. The free plan has 512 MB of memory.
      # compose.yaml's MAX_UPLOAD_MB maps to this Streamlit setting; Render has no compose.
      - key: STREAMLIT_SERVER_MAX_UPLOAD_SIZE
        value: "5"
